<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXGAMEHUB — Plateforme de jeux</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="hub.css?v=1">
</head>
<body>
    <div id="particles-bg"></div>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="#store">
                <span class="brand-icon">◆</span>
                <span class="brand-name">PIXGAMEHUB</span>
                <span class="brand-sub">PIXEL SOFTWARE DESIGN</span>
            </a>
            <nav class="main-nav">
                <a href="#store" class="nav-link active" data-nav="store" data-i18n="nav.store">BOUTIQUE</a>
                <a href="#library" class="nav-link" data-nav="library" data-i18n="nav.library">BIBLIOTHÈQUE</a>
                <a href="#community" class="nav-link" data-nav="community" data-i18n="nav.community">COMMUNAUTÉ</a>
                <a href="#studio" class="nav-link" data-nav="studio" data-i18n="nav.studio">STUDIO</a>
            </nav>
            <div class="topbar-right">
                <div class="search-box">
                    <input id="search-input" type="text" data-i18n-ph="hub.searchPh" placeholder="Rechercher un jeu..." />
                </div>
                <div class="stat-chip" data-i18n-title="hub.onlineTitle"><span id="stat-online">0</span> <span data-i18n="hub.online"></span></div>
                <div class="stat-chip" data-i18n-title="hub.roomsTitle"><span id="stat-rooms">0</span> <span data-i18n="hub.rooms"></span></div>
                <select id="hub-lang-select" class="lang-select" aria-label="Language">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="ar">🇸🇦 AR</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ja">🇯🇵 JA</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>
                <div class="user-zone" id="user-zone"></div>
            </div>
        </div>
    </header>

    <main id="view" class="view"></main>

    <footer class="hub-footer">
        <div class="footer-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-name">PIXEL SOFTWARE DESIGN</span>
            <span class="footer-tech" data-i18n="hub.footerTech">HTML5 Canvas · JavaScript · WebGL 2.0 · WebSocket</span>
        </div>
        <p class="footer-copy" data-i18n="hub.footerCopy">© 2026 Pixel Software Design — Tous les jeux jouables dans le navigateur</p>
    </footer>

    <div id="toast-root"></div>
    <div id="modal-root"></div>

    <script src="hub-i18n.js?v=1"></script>
    <script src="hub.js"></script>
    <script src="hub-app.js?v=3"></script>
</body>
</html>
