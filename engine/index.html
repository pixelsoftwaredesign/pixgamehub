<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moteur Graphique 2D — Manga / Ghibli / Pixel</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 8px 20px;
            background: rgba(0,0,0,0.6);
            border-bottom: 2px solid #333;
            width: 100%;
            z-index: 10;
        }
        #header h1 {
            font-size: 14px;
            color: #ffaa00;
            letter-spacing: 2px;
        }
        .control-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .control-label {
            font-size: 10px;
            color: #888;
            margin-right: 4px;
        }
        .theme-btn, .style-btn {
            background: #1a1a2e;
            border: 1px solid #333;
            color: #aaa;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .theme-btn:hover, .style-btn:hover {
            border-color: #ffaa00;
            color: #fff;
        }
        .theme-btn.active {
            background: #ffaa00;
            color: #000;
            border-color: #ffaa00;
        }
        .style-btn.active {
            background: #aa44ff;
            color: #fff;
            border-color: #aa44ff;
        }

        #game-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-canvas {
            background: #000;
            border: 2px solid #222;
        }

        #menu-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10,10,26,0.85);
            z-index: 5;
        }
        #menu-overlay h2 {
            font-size: 28px;
            color: #ffaa00;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255,170,0,0.3);
        }
        #menu-overlay p {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }
        #start-btn {
            background: #ffaa00;
            color: #000;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        #start-btn:hover {
            background: #ffcc44;
            transform: scale(1.05);
        }
        .controls-info {
            margin-top: 20px;
            font-size: 10px;
            color: #666;
            text-align: center;
            line-height: 1.8;
        }
        .controls-info span { color: #ffaa00; }

        #hud {
            display: none;
            position: absolute;
            top: 50px;
            left: 10px;
            right: 10px;
            z-index: 4;
            pointer-events: none;
        }
        #hp-bar-container {
            width: 200px;
            height: 8px;
            background: #222;
            border: 1px solid #444;
            border-radius: 2px;
            overflow: hidden;
        }
        #hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(#44dd44,#22aa22);
            transition: width 0.2s;
        }
        #stats {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: #666;
            pointer-events: none;
        }
        #stats span { color: #ffaa00; }

        #info-panel {
            position: absolute;
            top: 50px;
            right: 10px;
            font-size: 10px;
            color: #888;
            text-align: right;
            pointer-events: none;
            z-index: 4;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>MOTEUR 2D</h1>
        <div class="control-group">
            <span class="control-label">Thème:</span>
            <button class="theme-btn active" data-theme="desert">Desert</button>
            <button class="theme-btn" data-theme="jungle">Jungle</button>
            <button class="theme-btn" data-theme="lava">Lave</button>
            <button class="theme-btn" data-theme="ice">Glace</button>
            <button class="theme-btn" data-theme="arabian" style="border-color:#d4a017;color:#d4a017">Empire Arabe</button>
        </div>
        <div class="control-group">
            <span class="control-label">Style:</span>
            <button class="style-btn active" data-style="ghibli">Ghibli</button>
            <button class="style-btn" data-style="manga">Manga</button>
            <button class="style-btn" data-style="anime">Anime</button>
            <button class="style-btn" data-style="pixel">Pixel</button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="900" height="500"></canvas>

        <div id="menu-overlay">
            <h2>MOTEUR GRAPHIQUE 2D</h2>
            <p>Génération procédurale • Parallaxe • Particules • Shaders</p>
            <button id="start-btn">LANCER</button>
            <div class="controls-info">
                <span>WASD / ZQSD</span> — Déplacer<br>
                <span>W / Z / SPACE</span> — Sauter<br>
                <span>F</span> — Attaquer<br>
                <span>S</span> — Bloquer
            </div>
        </div>

        <div id="hud">
            <div id="hp-bar-container"><div id="hp-fill"></div></div>
        </div>

        <div id="stats">
            FPS: <span id="fps-display">0</span> |
            Particules: <span id="particle-count">0</span> |
            Vent: <span id="wind-force">0</span> |
            Lumieres: <span id="light-count">0</span> |
            <span id="theme-display">Desert</span>
        </div>

        <div id="info-panel">
            <div>Calques: <span>13</span></div>
            <div>Style: <span id="style-display">Ghibli</span></div>
            <div>Vent: <span>Actif</span></div>
            <div>Eclairage: <span>Dynamique</span></div>
        </div>
    </div>

    <script src="js/Renderer2D.js"></script>
    <script src="js/ProceduralWorld.js"></script>
    <script src="js/ParticleSystem.js"></script>
    <script src="js/StylePipeline.js"></script>
    <script src="js/AudioEngine.js"></script>
    <script src="js/SpriteManager.js"></script>
    <script src="js/LightingEngine.js"></script>
    <script src="js/WindSystem.js"></script>
    <script src="js/ArabianTheme.js"></script>
    <script src="js/ZelligePattern.js"></script>
    <script src="js/ClothSimulator.js"></script>
    <script src="js/EternalSands.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
