<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carthage — Globe 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#000; overflow:hidden; font-family:system-ui,monospace; color:#fff }
  canvas { display:block }

  #hud {
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.75); border:1px solid #c9a84c44;
    padding:8px 20px; border-radius:6px; font-size:13px;
    display:flex; gap:20px; align-items:center; z-index:10;
    pointer-events:none;
  }
  #hud span { color:#c9a84c }
  #hud em { color:#888; font-style:normal; font-size:11px }

  #info {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.8); border:1px solid #c9a84c33;
    padding:10px 24px; border-radius:8px; font-size:14px;
    z-index:10; pointer-events:none; text-align:center;
    min-width:200px; transition:opacity .3s;
  }
  #info .name { color:#c9a84c; font-weight:bold }
  #info .detail { color:#888; font-size:12px; margin-top:4px }
  #info .empty { color:#555; font-size:12px }
</style>
</head>
<body>

<div id="hud">
  <span>🌍</span> Globe Méditerranée <em>|</em>
  <span id="terr-count">36</span> territoires <em>|</em>
  Drag pour tourner · Scroll pour zoomer
</div>

<div id="info">
  <div class="empty">Cliquez sur un territoire</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

// ─── Config ────────────────────────────────────────────────────────
const RADIUS = 5
const COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#95a5a6']

const TERRITORIES = [
  {id:0,name:'Carthage',lon:10.3,lat:36.85,cap:true,adj:[1,2,35]},
  {id:1,name:'Utique',lon:10.1,lat:37.05,adj:[0,2]},
  {id:2,name:'Hadrumète',lon:10.8,lat:34.2,adj:[0,1,3]},
  {id:3,name:'Thapsus',lon:10.6,lat:34.7,adj:[2,4]},
  {id:4,name:'Lepcis Magna',lon:14.3,lat:32.7,adj:[3,5]},
  {id:5,name:'Cyrène',lon:17.9,lat:31.2,adj:[4]},
  {id:6,name:'Rome',lon:12.5,lat:41.9,cap:true,adj:[7,8,35]},
  {id:7,name:'Neapolis',lon:14.3,lat:40.8,adj:[6,8,9]},
  {id:8,name:'Capoue',lon:14.3,lat:41.1,adj:[6,7]},
  {id:9,name:'Tarente',lon:17.3,lat:40.5,adj:[7,10]},
  {id:10,name:'Brindisi',lon:17.9,lat:40.6,adj:[9]},
  {id:11,name:'Syracuse',lon:15.1,lat:37.1,adj:[12,35]},
  {id:12,name:'Agrigente',lon:13.6,lat:37.3,adj:[11]},
  {id:13,name:'Massilia',lon:5.4,lat:43.3,adj:[14,31]},
  {id:14,name:'Narbo',lon:3.0,lat:43.2,adj:[13,15]},
  {id:15,name:'Tarraco',lon:1.3,lat:41.1,adj:[14,16]},
  {id:16,name:'Sagonte',lon:-0.2,lat:39.7,adj:[15,17]},
  {id:17,name:'Corduba',lon:-4.8,lat:37.9,adj:[16,18]},
  {id:18,name:'Gadès',lon:-6.3,lat:36.5,adj:[17]},
  {id:19,name:'Alexandrie',lon:31.2,lat:30.0,cap:true,adj:[20,21,29]},
  {id:20,name:'Memphis',lon:31.1,lat:29.5,adj:[19,21]},
  {id:21,name:'Thèbes',lon:32.7,lat:25.7,adj:[19,20]},
  {id:22,name:'Athènes',lon:23.7,lat:38.0,cap:true,adj:[23,24,25]},
  {id:23,name:'Sparte',lon:22.4,lat:37.1,adj:[22,24]},
  {id:24,name:'Corinthe',lon:22.9,lat:37.9,adj:[22,23,25]},
  {id:25,name:'Thessalonique',lon:22.9,lat:40.6,adj:[22,24,26]},
  {id:26,name:'Byzance',lon:28.9,lat:41.0,cap:true,adj:[25,27]},
  {id:27,name:'Nicomédie',lon:29.9,lat:40.8,adj:[26,28]},
  {id:28,name:'Antioche',lon:36.2,lat:36.2,adj:[27,30]},
  {id:29,name:'Jerusalem',lon:35.2,lat:31.8,adj:[19]},
  {id:30,name:'Palmyre',lon:38.3,lat:34.6,adj:[28,29]},
  {id:31,name:'Césarée',lon:3.0,lat:36.8,adj:[0,13]},
  {id:32,name:'Cirta',lon:7.9,lat:36.6,adj:[0,31]},
  {id:33,name:'Hippone',lon:7.7,lat:36.9,adj:[31,32]},
  {id:34,name:'Lilybée',lon:12.6,lat:37.8,adj:[11,35]},
  {id:35,name:'Mer Tyrrhénienne',lon:11.5,lat:39.0,adj:[0,6,11,34]},
]

// ─── Lat/Lon → 3D ──────────────────────────────────────────────────
function latLonToVec3(lat, lon, radius) {
  const phi = (90 - lat) * Math.PI / 180
  const theta = (lon + 180) * Math.PI / 180
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  )
}

// Precompute 3D positions
for (const t of TERRITORIES) {
  t.pos = latLonToVec3(t.lat, t.lon, RADIUS)
}

// ─── Scene Setup ───────────────────────────────────────────────────
const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100)
camera.position.set(0, 3, 16)

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.2
document.body.prepend(renderer.domElement)

const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.08
controls.minDistance = 8
controls.maxDistance = 30
controls.autoRotate = true
controls.autoRotateSpeed = 0.6
controls.target.set(0, 0, 0)

// ─── Stars ─────────────────────────────────────────────────────────
const starsGeo = new THREE.BufferGeometry()
const starCount = 4000
const starPos = new Float32Array(starCount * 3)
for (let i = 0; i < starCount * 3; i++) {
  starPos[i] = (Math.random() - 0.5) * 200
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3))
const starsMat = new THREE.PointsMaterial({
  color: 0xffffff, size: 0.15, sizeAttenuation: true, transparent: true, opacity: 0.8
})
scene.add(new THREE.Points(starsGeo, starsMat))

// ─── Globe ─────────────────────────────────────────────────────────
// Procedural canvas texture
function makeGlobeTexture() {
  const c = document.createElement('canvas')
  c.width = 1024; c.height = 512
  const ctx = c.getContext('2d')

  // Ocean gradient
  const grad = ctx.createRadialGradient(512, 256, 0, 512, 256, 400)
  grad.addColorStop(0, '#0a1628')
  grad.addColorStop(0.6, '#0d1f3c')
  grad.addColorStop(1, '#050d1a')
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, 1024, 512)

  // Lat/lon grid
  ctx.strokeStyle = '#1a3a6a'
  ctx.lineWidth = 0.5
  ctx.globalAlpha = 0.4

  // Latitude lines every 10°
  for (let lat = -80; lat <= 80; lat += 10) {
    const y = (90 - lat) / 180 * 512
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke()
  }
  // Longitude lines every 10°
  for (let lon = -180; lon <= 180; lon += 10) {
    const x = (lon + 180) / 360 * 1024
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke()
  }

  // Equator highlight
  ctx.strokeStyle = '#2a5a9a'; ctx.lineWidth = 1; ctx.globalAlpha = 0.6
  const eqY = 512 / 2
  ctx.beginPath(); ctx.moveTo(0, eqY); ctx.lineTo(1024, eqY); ctx.stroke()

  // Continent silhouettes (rough Mediterranean region)
  ctx.globalAlpha = 0.15

  function fillContinent(pts) {
    ctx.beginPath()
    for (let i = 0; i < pts.length; i++) {
      const [lon, lat] = pts[i]
      const x = (lon + 180) / 360 * 1024
      const y = (90 - lat) / 180 * 512
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)
    }
    ctx.closePath()
    ctx.fillStyle = '#2a6a3a'
    ctx.fill()
    ctx.strokeStyle = '#3a8a4a'
    ctx.lineWidth = 0.5
    ctx.stroke()
  }

  // Europe (rough)
  fillContinent([
    [-10, 50], [0, 52], [5, 51], [7, 49], [5, 47], [7, 45], [5, 43],
    [7, 41], [12, 42], [15, 44], [20, 46], [25, 44], [30, 45], [28, 41],
    [25, 39], [22, 37], [24, 35], [21, 35], [15, 37], [12, 38], [10, 37],
    [5, 37], [3, 36], [-2, 37], [-5, 36], [-8, 37], [-10, 40], [-10, 45]
  ])

  // Africa (rough north)
  fillContinent([
    [-5, 36], [-2, 35], [0, 34], [3, 33], [5, 34], [7, 33], [10, 35],
    [12, 34], [15, 33], [18, 33], [20, 32], [25, 31], [30, 31], [32, 30],
    [35, 32], [38, 35], [36, 36], [35, 32], [32, 28], [30, 27], [25, 28],
    [20, 30], [15, 30], [10, 30], [5, 32], [0, 31], [-5, 33], [-10, 30],
    [-10, 36]
  ])

  // Asia Minor (rough)
  fillContinent([
    [25, 38], [28, 38], [30, 38], [32, 37], [36, 36], [38, 35],
    [36, 37], [32, 39], [30, 40], [28, 41], [26, 41], [25, 40]
  ])

  ctx.globalAlpha = 1
  return new THREE.CanvasTexture(c)
}

const globeMat = new THREE.MeshPhongMaterial({
  map: makeGlobeTexture(),
  transparent: true,
  opacity: 0.95,
  specular: 0x112244,
  shininess: 25,
})
const globe = new THREE.Mesh(new THREE.SphereGeometry(RADIUS * 0.98, 48, 36), globeMat)
scene.add(globe)

// Outer glow ring
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x1a3a6a,
  transparent: true,
  opacity: 0.15,
  side: THREE.BackSide,
})
const glow = new THREE.Mesh(new THREE.SphereGeometry(RADIUS * 1.02, 32, 24), glowMat)
scene.add(glow)

// ─── Light ─────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x222244, 0.6)
scene.add(ambient)

const sun = new THREE.DirectionalLight(0xffeedd, 1.8)
sun.position.set(10, 15, 5)
scene.add(sun)

const fill = new THREE.DirectionalLight(0x4488ff, 0.4)
fill.position.set(-10, -5, -10)
scene.add(fill)

// ─── Territory Dots ─────────────────────────────────────────────────
const dotGroup = new THREE.Group()

const dotGeo = new THREE.SphereGeometry(0.12, 12, 10)
const capGeo = new THREE.SphereGeometry(0.18, 16, 14)
const glowDotGeo = new THREE.SphereGeometry(0.28, 16, 14)

for (const t of TERRITORIES) {
  const isCap = t.cap
  const g = isCap ? capGeo : dotGeo
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff })
  const mesh = new THREE.Mesh(g, mat)
  mesh.position.copy(t.pos)

  // Orient to face outward
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), t.pos.clone().normalize())

  // Extra glow dot
  const gMat = new THREE.MeshBasicMaterial({
    color: 0x4488ff, transparent: true, opacity: 0.2
  })
  const glowM = new THREE.Mesh(isCap ? new THREE.SphereGeometry(0.35, 12, 10) : glowDotGeo, gMat)
  glowM.position.copy(t.pos)
  glowM.quaternion.copy(mesh.quaternion)
  t._glow = glowM
  dotGroup.add(glowM)

  t._mesh = mesh
  t._mat = mat
  dotGroup.add(mesh)

  // Label sprite
  const canvas = document.createElement('canvas')
  canvas.width = 256; canvas.height = 64
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = 'transparent'; ctx.fillRect(0, 0, 256, 64)
  ctx.font = 'bold 28px system-ui'
  ctx.textAlign = 'center'
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 6
  ctx.fillStyle = '#ddd'
  ctx.fillText(t.name, 128, 38)

  const tex = new THREE.CanvasTexture(canvas)
  tex.minFilter = THREE.LinearFilter
  const spriteMat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, sizeAttenuation: true
  })
  const sprite = new THREE.Sprite(spriteMat)
  const labelDist = RADIUS * 1.18
  sprite.position.copy(t.pos.clone().normalize().multiplyScalar(labelDist))
  sprite.scale.set(1.6, 0.4, 1)
  t._sprite = sprite
  dotGroup.add(sprite)
}
scene.add(dotGroup)

// ─── Adjacency Lines ───────────────────────────────────────────────
const lineGroup = new THREE.Group()
const lineMat = new THREE.LineBasicMaterial({
  color: 0x2a5a9a, transparent: true, opacity: 0.15
})

for (const t of TERRITORIES) {
  for (const nId of t.adj) {
    if (nId > t.id) continue // draw each edge once
    const n = TERRITORIES.find(x => x.id === nId)
    if (!n) continue

    // Arc between points on sphere surface
    const pts = []
    const steps = 20
    const p1 = t.pos.clone().normalize().multiplyScalar(RADIUS * 1.01)
    const p2 = n.pos.clone().normalize().multiplyScalar(RADIUS * 1.01)
    for (let i = 0; i <= steps; i++) {
      const t2 = i / steps
      const p = new THREE.Vector3().lerpVectors(p1, p2, t2)
      p.normalize().multiplyScalar(RADIUS * 1.01)
      pts.push(p)
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts)
    const line = new THREE.Line(geo, lineMat)
    lineGroup.add(line)
  }
}
scene.add(lineGroup)

// ─── Selection Pulse Ring ──────────────────────────────────────────
const ringGeo = new THREE.RingGeometry(0.25, 0.35, 24)
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xc9a84c, transparent: true, opacity: 0,
  side: THREE.DoubleSide, depthWrite: false
})
const ring = new THREE.Mesh(ringGeo, ringMat)
scene.add(ring)

// ─── Raycaster ─────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster()
const pointer = new THREE.Vector2()
let selectedId = null
const infoEl = document.getElementById('info')

renderer.domElement.addEventListener('pointerdown', e => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1

  raycaster.setFromCamera(pointer, camera)
  const meshes = TERRITORIES.map(t => t._mesh)
  const hits = raycaster.intersectObjects(meshes)

  if (hits.length) {
    const hit = hits[0].object
    const t = TERRITORIES.find(t => t._mesh === hit)
    if (t) selectTerritory(t.id)
  }
})

function selectTerritory(id) {
  selectedId = id
  const t = TERRITORIES.find(t => t.id === id)
  if (!t) return

  // Update info
  infoEl.innerHTML = `
    <div class="name">${t.cap ? '🏛 ' : ''}${t.name}</div>
    <div class="detail">${t.cap ? 'Capitale · ' : ''}${t.adj.length} voisins</div>
  `

  // Position ring
  const pos = t.pos.clone().normalize().multiplyScalar(RADIUS * 1.01)
  ring.position.copy(pos)
  ring.lookAt(new THREE.Vector3(0, 0, 0))
  ringMat.opacity = 0.8

  // Highlight all dots
  for (const t2 of TERRITORIES) {
    t2._mat.color.set(t2.id === id ? 0xffd700 : (t2.adj.includes(id) ? 0x44aaff : 0x888888))
    t2._glow.material.color.set(t2.id === id ? 0xffd700 : (t2.adj.includes(id) ? 0x4488ff : 0x333333))
    t2._glow.material.opacity = t2.id === id ? 0.5 : (t2.adj.includes(id) ? 0.25 : 0.05)
    t2._mesh.scale.setScalar(t2.id === id ? 1.6 : (t2.adj.includes(id) ? 1.3 : 1))
  }
}

// ─── Resize ────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

// ─── Animate ───────────────────────────────────────────────────────
let time = 0

function animate() {
  requestAnimationFrame(animate)
  time += 0.016
  controls.update()

  // Pulse ring
  if (selectedId !== null) {
    ringMat.opacity = 0.3 + 0.3 * Math.sin(time * 3)
    const s = 1 + 0.08 * Math.sin(time * 2)
    ring.scale.setScalar(s)
  }

  // Pulse glow dots
  for (const t of TERRITORIES) {
    t._glow.material.opacity *= 0.98 + 0.02 * Math.sin(time * 2 + t.id)
  }

  renderer.render(scene, camera)
}

animate()

// ─── Select Carthage initially ─────────────────────────────────────
setTimeout(() => selectTerritory(0), 500)

console.log(`🌍 Globe prêt · ${TERRITORIES.length} territoires`)

</script>
</body>
</html>
