<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kung Fu Arena - Combat de Rue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../.." class="back-btn">← Hub</a>

    <!-- TITLE SCREEN -->
    <div id="title-screen" class="screen active">
        <div class="title-content">
            <h1 class="game-title">KUNG FU ARENA</h1>
            <p class="game-subtitle">COMBAT DE RUE</p>
            <div class="title-ornament">⚔ ⚔ ⚔</div>
            <button id="btn-play" class="menu-btn pulse">PLAYER SELECT</button>
            <p class="controls-hint">2 Players • Same Keyboard</p>
        </div>
        <div class="title-bg"></div>
    </div>

    <!-- CHARACTER SELECT -->
    <div id="select-screen" class="screen">
        <h2 class="select-title">CHOOSE YOUR FIGHTER</h2>
        <div class="select-layout">
            <div class="player-select" id="p1-select">
                <div class="player-label p1-color">PLAYER 1</div>
                <div class="fighter-cards" id="p1-cards"></div>
                <div class="selected-display" id="p1-selected">—</div>
            </div>
            <div class="vs-divider">VS</div>
            <div class="player-select" id="p2-select">
                <div class="player-label p2-color">PLAYER 2</div>
                <div class="fighter-cards" id="p2-cards"></div>
                <div class="selected-display" id="p2-selected">—</div>
            </div>
        </div>
        <div class="controls-display">
            <div class="ctrl-col">
                <strong>P1 Controls</strong>
                <span>WASD Move</span>
                <span>F Punch | G Kick | H Special</span>
                <span>A Block</span>
            </div>
            <div class="ctrl-col">
                <strong>P2 Controls</strong>
                <span>↑↓←→ Move</span>
                <span>J Punch | K Kick | L Special</span>
                <span>← Block</span>
            </div>
        </div>
        <button id="btn-fight" class="menu-btn" disabled>FIGHT!</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <canvas id="game-canvas"></canvas>
        <div id="game-ui">
            <div class="health-row">
                <div class="player-hud" id="hud-p1">
                    <div class="hud-name p1-color">P1</div>
                    <div class="hp-bar-outer">
                        <div class="hp-bar-inner" id="hp1"></div>
                        <div class="hp-bar-damage" id="hp1-dmg"></div>
                    </div>
                    <div class="meter-bar-outer">
                        <div class="meter-bar-inner" id="meter1"></div>
                    </div>
                    <div class="round-dots" id="rounds1"></div>
                </div>
                <div id="timer-box">
                    <div id="timer">99</div>
                </div>
                <div class="player-hud" id="hud-p2">
                    <div class="hud-name p2-color">P2</div>
                    <div class="hp-bar-outer">
                        <div class="hp-bar-inner" id="hp2"></div>
                        <div class="hp-bar-damage" id="hp2-dmg"></div>
                    </div>
                    <div class="meter-bar-outer">
                        <div class="meter-bar-inner" id="meter2"></div>
                    </div>
                    <div class="round-dots" id="rounds2"></div>
                </div>
            </div>
            <div id="combo-p1" class="combo-display left"></div>
            <div id="combo-p2" class="combo-display right"></div>
        </div>
        <div id="round-overlay" class="hidden">
            <div id="round-text"></div>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">
        <div class="result-content">
            <h2 id="winner-text"></h2>
            <button id="btn-rematch" class="menu-btn pulse">REMATCH</button>
            <button id="btn-back-select" class="menu-btn">CHARACTER SELECT</button>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="../../shared/music.js"></script>
<script src="../../gamepad.js"></script>
</body>
</html>
